<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>CalorieApp</title><style>* { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      #root { display: flex; min-height: 100vh; }</style><script>window.onerror=function(m,s,l,c,e){document.body.innerHTML='<pre style="padding:16px;color:#b00;white-space:pre-wrap;font:12px monospace">JS ERROR: '+m+'\nat '+s+':'+l+':'+c+'\n\n'+(e&&e.stack||'')+'</pre>'};window.addEventListener('unhandledrejection',function(e){document.body.innerHTML='<pre style="padding:16px;color:#b00;white-space:pre-wrap;font:12px monospace">PROMISE: '+(e.reason&&e.reason.stack||e.reason)+'</pre>'});</script><script defer="defer" src="/CalorieApp/bundle.js"></script></head><body><div id="root"></div></body></html>
